services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/app.db
      JWT_SECRET_KEY: change-this-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    volumes:
      - app_data:/data

volumes:
  app_data:
